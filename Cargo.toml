[package]
name = "mulot-scan"
version = "0.1.0"
edition = "2024"
# Imposé par egui/eframe 0.37.
rust-version = "1.95"
description = "Mulot-scan: unofficial cross-platform software for scanner mice (compatible with IRIScan Mouse / Dacuda Scanner Mouse)"
license = "MIT OR Apache-2.0"
exclude = ["/build", "/dist", "/winapp"]

[dependencies]
anyhow = "1"
log = "0.4"
env_logger = "0.11"
crossbeam-channel = "0.5"
parking_lot = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp"] }
rayon = "1"
rustfft = "6"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
docx-rs = "0.4"
which = "8"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Media_MediaFoundation",
    "Win32_Media_KernelStreaming",
    "Win32_Media_DirectShow",
] }

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[build-dependencies]
embed-resource = "3"
